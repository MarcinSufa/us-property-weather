<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add property</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
body{margin:0;background:#F3F5F7}
a{color:#0B5D5E}a:hover{color:#084647}
</style>
</helmet>
<div style="min-height: 820px; background: #F3F5F7; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #16202E; font-size: 15px; line-height: 1.45">
  <header style="background: #FFFFFF; border-bottom: 1px solid #D5DBE1">
    <div style="max-width: 1120px; margin: 0 auto; padding: 12px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
      <a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; min-height: 44px; color: #16202E; text-decoration: none; font-weight: 600; font-size: 17px">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0B5D5E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"></path><path d="M5.5 10v10h13V10"></path><path d="M10 20v-6h4v6"></path></svg>
        <span>Properties</span>
      </a>
    </div>
  </header>

  <main style="max-width: 640px; margin: 0 auto; padding: 32px 24px 48px; display: flex; flex-direction: column; gap: 24px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <a href="Main.dc.html" style="display: inline-flex; align-items: center; gap: 6px; min-height: 44px; align-self: flex-start">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
        <span>All properties</span>
      </a>
      <h1 style="margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -0.01em">Add property</h1>
      <p style="margin: 0; color: #4A5868">The weather at this address is looked up once, when you save, and stored with the property.</p>
    </div>

    <form style="background: #FFFFFF; border: 1px solid #D5DBE1; border-radius: 10px; padding: 24px; display: flex; flex-direction: column; gap: 20px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="n-street" style="font-size: 13px; font-weight: 500; color: #4A5868">Street</label>
        <input id="n-street" type="text" required maxlength="200" autocomplete="address-line1" placeholder="15 Saguaro Blvd" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #7B8794; border-radius: 6px; font: inherit; color: #16202E; background: #FFFFFF">
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="n-city" style="font-size: 13px; font-weight: 500; color: #4A5868">City</label>
        <input id="n-city" type="text" required maxlength="100" autocomplete="address-level2" placeholder="Fountain Hills" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #7B8794; border-radius: 6px; font: inherit; color: #16202E; background: #FFFFFF">
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="n-state" style="font-size: 13px; font-weight: 500; color: #4A5868">State</label>
          <select id="n-state" required autocomplete="address-level1" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #7B8794; border-radius: 6px; font: inherit; color: #16202E; background: #FFFFFF">
            <option value="">Select a state</option>
            <option>AL Alabama</option>
            <option>AK Alaska</option>
            <option>AZ Arizona</option>
            <option>AR Arkansas</option>
            <option>CA California</option>
          </select>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="n-zip" style="font-size: 13px; font-weight: 500; color: #4A5868">Zip code</label>
          <input id="n-zip" type="text" required inputmode="numeric" pattern="\d{5}" maxlength="5" autocomplete="postal-code" placeholder="85268" aria-describedby="n-zip-hint" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #7B8794; border-radius: 6px; font: inherit; font-family: 'IBM Plex Mono', ui-monospace, monospace; color: #16202E; background: #FFFFFF">
          <p id="n-zip-hint" style="margin: 0; font-size: 13px; color: #4A5868">5 digits. The weather lookup uses it.</p>
        </div>
      </div>
      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding-top: 4px">
        <button type="button" style="height: 44px; padding: 0 20px; border: 1px solid #0B5D5E; border-radius: 6px; background: #0B5D5E; color: #FFFFFF; font: inherit; font-weight: 500; cursor: pointer">Add property</button>
        <a href="Main.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 12px; color: #4A5868; text-decoration: none">Cancel</a>
      </div>
    </form>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":820}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
